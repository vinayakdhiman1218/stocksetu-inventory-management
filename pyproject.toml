[project]
name = "stocksetu-inventory-management"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "SQLAlchemy==2.1.4",
  "PyJWT==2.15.1",
  "pwdlib==0.3.1",
  "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python build_frontend.py"
